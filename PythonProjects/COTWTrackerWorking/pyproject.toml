[project]
name = "cotwtrackerworking"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.8",
    "kaitaistruct>=0.10",
    "mmh3>=5.3.0",
    "numba>=0.67.0",
    "numpy>=2.4.3",
    "packaging>=25.0",
    "pandas>=3.0.1",
    "zstandard>=0.25.0",
    "openpyxl>=3.1.5",
    "xlsxwriter>=3.2.9",
    "pygltflib>=1.16.5",
    "scipy>=1.18.1",
]

[project.scripts]
cotwtrackerworking = "cotwtrackerworking:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
