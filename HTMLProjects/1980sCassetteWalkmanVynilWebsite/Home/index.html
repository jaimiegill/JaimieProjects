<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Styles/styles.css">
    <title>1980CWV</title>
</head>
<body>

    <!-- Hidden state toggle to reveal the collection carousel -->
    <input type="checkbox" id="box-toggle" class="box-toggle-checkbox">

    <!-- Top Navigation Header -->
    <header class="banner-container">
        <div class="banner-scanlines"></div>
        <div class="banner-top-row">
            <div class="pixel-reel-icon">
                <div class="reel-spool left-spool"></div>
                <div class="reel-spool right-spool"></div>
            </div>
            <h1 class="pixel-title">1980CWV</h1>
            <div class="pixel-equalizer">
                <span class="eq-bar bar-1"></span>
                <span class="eq-bar bar-2"></span>
                <span class="eq-bar bar-3"></span>
                <span class="eq-bar bar-4"></span>
                <span class="eq-bar bar-5"></span>
            </div>
            <div class="rec-badge">
                <span class="rec-dot"></span>
                <span>REC</span>
            </div>
        </div>
        <nav class="banner-selector">
            <button class="select-btn active">ALL TAPES</button>
            <button class="select-btn">SYNTHWAVE</button>
            <button class="select-btn">ARCADE</button>
            <button class="select-btn">LOCKED</button>
        </nav>
    </header>

    <!-- NEW Vibrant & Detailed Collection Banner -->
    <section class="carousel-bar">
        <!-- New Pixel Art Elements: Gold, Gems, Coins, and Arcade (Left Side) -->
        <div class="banner-decor decor-left">
            <div class="gold-stacks"></div>
            <div class="coin-piles"></div>
            <div class="gem-scatter"></div>
            <div class="arcade-cabinet-mini">
                <div class="pixel-sprite hero"></div>
            </div>
        </div>

        <div class="rack-corner top-left"></div>
        <div class="rack-corner top-right"></div>
        
        <div class="carousel-status-bar">
            <div class="status-lcd">
                <span class="lcd-dot green"></span>
                <span class="lcd-text">VAULT LOADED</span>
            </div>
            <div class="carousel-title-tag">
                <span class="scroll-arrow">◄</span>
                SELECT TAPE
                <span class="scroll-arrow">►</span>
            </div>
            <div class="tape-counter-display">
                <span class="counter-label">COUNT</span>
                <span class="counter-value">09</span>
            </div>
        </div>

        <div class="carousel-tray">
            <div class="carousel-track">

                <!-- Enhanced & More Detailed Front-Facing Tapes -->
                <div class="front-tape tape-synth active">
                    <div class="tape-screws"><span></span><span></span><span></span><span></span></div>
                    <div class="tape-glare"></div>
                    <div class="tape-label-area">
                        <span class="tape-type">TYPE I</span>
                        <div class="label-main">
                            <span class="tape-title-text">SYNTH '84</span>
                            <span class="tape-spine-detail">A SIDE</span>
                        </div>
                        <span class="tape-time">60 MIN</span>
                    </div>
                    <div class="tape-window">
                        <div class="spool left-spool"><div class="spool-teeth"></div></div>
                        <div class="ribbon"></div>
                        <div class="spool right-spool"><div class="spool-teeth"></div></div>
                    </div>
                    <div class="tape-bottom-wedge"></div>
                </div>

                <div class="front-tape tape-blue">
                    <div class="tape-screws"><span></span><span></span><span></span><span></span></div>
                    <div class="tape-glare"></div>
                    <div class="tape-label-area">
                        <span class="tape-type">TYPE II</span>
                        <div class="label-main">
                            <span class="tape-title-text">CHIP TAPE</span>
                            <span class="tape-spine-detail">ARCADE</span>
                        </div>
                        <span class="tape-time">45 MIN</span>
                    </div>
                    <div class="tape-window">
                        <div class="spool left-spool"><div class="spool-teeth"></div></div>
                        <div class="ribbon"></div>
                        <div class="spool right-spool"><div class="spool-teeth"></div></div>
                    </div>
                    <div class="tape-bottom-wedge"></div>
                </div>

                <div class="front-tape tape-orange">
                    <div class="tape-screws"><span></span><span></span><span></span><span></span></div>
                    <div class="tape-glare"></div>
                    <div class="tape-label-area">
                        <span class="tape-type">TYPE I</span>
                        <div class="label-main">
                            <span class="tape-title-text">VOL. 02</span>
                            <span class="tape-spine-detail">MIX</span>
                        </div>
                        <span class="tape-time">90 MIN</span>
                    </div>
                    <div class="tape-window">
                        <div class="spool left-spool"><div class="spool-teeth"></div></div>
                        <div class="ribbon"></div>
                        <div class="spool right-spool"><div class="spool-teeth"></div></div>
                    </div>
                    <div class="tape-bottom-wedge"></div>
                </div>

                <div class="front-tape tape-green">
                    <div class="tape-screws"><span></span><span></span><span></span><span></span></div>
                    <div class="tape-glare"></div>
                    <div class="tape-label-area">
                        <span class="tape-type">TYPE IV</span>
                        <div class="label-main">
                            <span class="tape-title-text">CYBER MIX</span>
                            <span class="tape-spine-detail">HIGH TECH</span>
                        </div>
                        <span class="tape-time">60 MIN</span>
                    </div>
                    <div class="tape-window">
                        <div class="spool left-spool"><div class="spool-teeth"></div></div>
                        <div class="ribbon"></div>
                        <div class="spool right-spool"><div class="spool-teeth"></div></div>
                    </div>
                    <div class="tape-bottom-wedge"></div>
                </div>

                <div class="front-tape tape-dark">
                    <div class="tape-screws"><span></span><span></span><span></span><span></span></div>
                    <div class="tape-glare"></div>
                    <div class="tape-label-area">
                        <span class="tape-type">DEMO</span>
                        <div class="label-main">
                            <span class="tape-title-text">DEMO TAPE</span>
                            <span class="tape-spine-detail">REC ONLY</span>
                        </div>
                        <span class="tape-time">15 MIN</span>
                    </div>
                    <div class="tape-window">
                        <div class="spool left-spool"><div class="spool-teeth"></div></div>
                        <div class="ribbon"></div>
                        <div class="spool right-spool"><div class="spool-teeth"></div></div>
                    </div>
                    <div class="tape-bottom-wedge"></div>
                </div>

            </div>
        </div>

        <!-- Pixel Art Elements (Right Side) -->
        <div class="banner-decor decor-right">
            <div class="gem-scatter"></div>
            <div class="coin-piles"></div>
            <div class="gold-stacks"></div>
            <div class="pixel-arcade-icon joystick"></div>
            <div class="pixel-arcade-icon buttons"></div>
        </div>
    </section>

    <!-- Left Sidebar with Enhanced Storage Box -->
    <aside class="sidebar">
        <label for="box-toggle" class="wooden-box-wrapper" title="Click to open collection banner">
            <div class="wooden-box">
                <div class="corner-bracket top-left"></div>
                <div class="corner-bracket top-right"></div>
                <div class="corner-bracket bottom-left"></div>
                <div class="corner-bracket bottom-right"></div>

                <div class="box-header-label">
                    <span class="plaque-screw"></span>
                    CASSETTE VAULT
                    <span class="plaque-screw"></span>
                </div>

                <div class="rack-frame">
                    <div class="box-rack">
                        <div class="upright-tape tape-synth">
                            <div class="tab-notch"></div>
                            <div class="tape-label">SYNTH '84</div>
                            <div class="tab-notch"></div>
                        </div>
                        <div class="upright-tape tape-blue">
                            <div class="tab-notch"></div>
                            <div class="tape-label">CHIP TAPE</div>
                            <div class="tab-notch"></div>
                        </div>
                        <div class="upright-tape tape-orange">
                            <div class="tab-notch"></div>
                            <div class="tape-label">VOL. 02</div>
                            <div class="tab-notch"></div>
                        </div>
                        <div class="upright-tape tape-green">
                            <div class="tab-notch"></div>
                            <div class="tape-label">CYBER MIX</div>
                            <div class="tab-notch"></div>
                        </div>
                        <div class="upright-tape tape-dark">
                            <div class="tab-notch"></div>
                            <div class="tape-label">DEMO TAPE</div>
                            <div class="tab-notch"></div>
                        </div>
                    </div>

                    <div class="plastic-cover">
                        <div class="plastic-glare"></div>
                        <div class="plastic-edge-highlight"></div>
                    </div>
                </div>
            </div>
        </label>
    </aside>

    <main class="content-container">
        <!-- Main player controls and active track details -->
    </main>

</body>
</html>
